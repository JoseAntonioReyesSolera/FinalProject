<div class="hand-container">
  @for (card of handCards; track card.instanceId) {
    @for (i of getCopies(card.quantity); track i) {
  <button (click)="onCardClick($event, card)" style="background-color: transparent; border-color: transparent">
  <div class="card-item" [class.can-cast]="canCast(card)">
    <p><span [innerHTML]="card.sanitizedManaCost"></span><br></p>
    @if (card.card_faces && !card.isSingleImageDoubleFace) {
      <img [src]="card.card_faces[card.currentFaceIndex]?.image_uris?.normal" alt="{{ card.name }}">
    } @else {
      <img [src]="card.image_uris?.normal" alt="{{ card.name }}">
    }
  </div>
  </button>
  }
  }
</div>

@if (selectedCardForDetails) {
<app-card-detail
  [card]="selectedCardForDetails"
  [visible]="modalVisible"
  (closed)="modalVisible = false">
</app-card-detail>
}
<!-- Menú contextual -->
@if (contextMenuVisible) {
  <button (click)="contextMenuVisible = false" style="background-color: transparent; border-color: transparent">
<div
     class="context-menu"
     [style.top.px]="contextMenuPosition.y"
     [style.left.px]="contextMenuPosition.x">
  <ul>
    <li><button (click)="castSpell(selectedCard)" style="border: transparent; background-color: transparent">Lanzar hechizo</button></li>
    <li><button (click)="viewDetails(selectedCard)" style="border: transparent; background-color: transparent">Ver detalles</button></li>
    <li><button (click)="moveToLibrary(selectedCard)" style="border: transparent; background-color: transparent">Mover a la biblioteca</button></li>
    <li><button (click)="moveToGraveyard(selectedCard)" style="border: transparent; background-color: transparent">Descartar</button></li>
    <li><button (click)="moveToExile(selectedCard)" style="border: transparent; background-color: transparent">Exiliar</button></li>
  </ul>
</div>
  </button>
}
