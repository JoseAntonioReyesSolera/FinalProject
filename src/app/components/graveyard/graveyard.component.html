<div class="graveyard-container">
  <button (click)="openModal()" style="background-color: transparent; border-color: transparent">
  <img [src]="lastGraveImage"
       alt="Graveyard"
       class="graveyard-image">
  </button>
</div>

<!-- Modal para el cementerio y exilio -->
<div class="modal fade" id="graveyardModal" tabindex="-1" aria-labelledby="graveyardModalLabel" aria-hidden="true" style="display: none">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="tabs">
        <button (click)="showMainDeck()">Graveyard</button>
        <button (click)="showSideboard()">Exile</button>
      </div>
      <div class="modal-header">
        <h5 class="modal-title" id="graveyardModalLabel">Select the cards you want to move</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <app-zone-viewer
          [zoneName]="isExile ? 'Exile' : 'Graveyard'"
          [zoneType]="isExile ? 'exile' : 'graveyard'"
          [cards]="isExile ? exileCards : graveyardCards">
        </app-zone-viewer>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" type="button" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
  </div>
