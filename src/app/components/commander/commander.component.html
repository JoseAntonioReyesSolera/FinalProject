<div class="commander-container">
    @for (commander of getCommanderCards() | async; track commander.instanceId) {
    <button (click)="onCardClick($event, commander)" style="border: transparent; background-color: transparent">
      <img [src]="commander?.image_uris?.normal" alt="{{ commander?.name }}" class="commander-image card">
    </button>
      }
</div>

@if (selectedCardForDetails) {
  <app-card-detail
    [card]="selectedCardForDetails"
    [visible]="modalVisible"
    (closed)="modalVisible = false">
  </app-card-detail>
}

@if (contextMenuVisible) {
  <button (click)="contextMenuVisible = false" style="background-color: transparent; border-color: transparent">
  <div
    class="context-menu"
    [style.top.px]="contextMenuPosition.y"
    [style.left.px]="contextMenuPosition.x"
  >
    <ul>
      <li><button (click)="castSpell(selectedCard!)" style="border: transparent; background-color: transparent">Lanzar hechizo</button></li>
      <li><button (click)="viewDetails(selectedCard)" style="border: transparent; background-color: transparent">Ver detalles</button></li>
      <li><button (click)="moveToHand(selectedCard!)" style="border: transparent; background-color: transparent">Mover a la mano</button></li>
      <li><button (click)="unassignCommander(selectedCard!)" style="border: transparent; background-color: transparent">Desmarcar como comandante</button></li>
    </ul>
  </div>
  </button>
}
